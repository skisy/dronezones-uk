name: Report a problem
description: Something in Drone Zones UK isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Posts here are public, so please don't include personal details such as your home location.
        Wrong roads or places on the base map? Those come from OpenStreetMap: [fix them there](https://www.openstreetmap.org/fixthemap).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we see it? (steps, or the place or zone involved)
    validations:
      required: false
  - type: textarea
    id: details
    attributes:
      label: App details
      description: In the app, tap the logo, then **Copy app details** at the bottom of the About page, and paste here.
      render: text
    validations:
      required: false
